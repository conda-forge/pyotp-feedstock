schema_version: 1

context:
  name: pyotp
  version: "2.12.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 8d0c4192f3c5d1b1a8792df23b9d8acbb7e70abd2b160962af55c5700edbd236

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pyotp
      pip_check: false
      python_version:
        - ${{ python_min }}
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: Python One Time Password Library
  description: PyOTP - The Python One-Time Password Library. PyOTP is a Python library for generating and verifying one-time passwords. It can be used to implement two-factor (2FA) or multi-factor (MFA) authentication methods in web applications and in other systems that require users to log in.
  homepage: https://github.com/pyauth/pyotp
  repository: https://github.com/pyauth/pyotp
  documentation: https://pyotp.readthedocs.io/

extra:
  recipe-maintainers:
    - kalling
    - smithsp
    - jan-janssen
